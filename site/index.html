<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бал → ECTS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5rem; }
    input { font-size: 1.2rem; width: 6em; padding: 4px 8px; }
    #result { font-size: 3rem; font-weight: bold; margin: 24px 0; min-height: 1.2em; }
    footer { margin-top: 48px; font-size: 0.85rem; color: #777; }
  </style>
</head>
<body>
  <h1>Переведення балу в оцінку ECTS</h1>
  <label>Бал (0–100): <input id="score" type="number" min="0" max="100" value="90"></label>
  <div id="result"></div>

  <!-- Під час збірки конвеєр підставляє сюди хеш коміту: видно, яка саме версія розгорнута -->
  <footer>Версія: <a href="__COMMIT_URL__">__VERSION__</a></footer>

  <script type="module">
    import { toEcts } from './grade.js';
    const input = document.getElementById('score');
    const result = document.getElementById('result');
    function update() {
      try { result.textContent = toEcts(Number(input.value)); }
      catch { result.textContent = '—'; }
    }
    input.addEventListener('input', update);
    update();
  </script>
</body>
</html>
